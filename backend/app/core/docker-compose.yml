version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: careerforge-mysql
    environment:
      MYSQL_ROOT_PASSWORD: yourpassword
      MYSQL_DATABASE: careerforge
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: careerforge-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:yourpassword@mysql:3306/careerforge
    depends_on:
      - mysql

volumes:
  mysql-data:
